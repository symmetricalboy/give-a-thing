<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="32" height="32" fill="#140f1d"/>

  <!-- Subtle 32x32 pixel circle backdrop (centered at 16,16, radius 13.5 — well inside r=16 avatar crop) -->
  <rect x="11" y="3" width="10" height="26" fill="#1d152b"/>
  <rect x="8" y="4" width="16" height="24" fill="#1d152b"/>
  <rect x="6" y="6" width="20" height="20" fill="#1d152b"/>
  <rect x="4" y="8" width="24" height="16" fill="#1d152b"/>
  <rect x="3" y="11" width="26" height="10" fill="#1d152b"/>

  <!-- Separated Pixel Sparkles (all inside r <= 12.8) -->
  <!-- Top-left gold 4-point star at (7,8) -->
  <rect x="7" y="7" width="1" height="1" fill="#f5c451"/>
  <rect x="6" y="8" width="1" height="1" fill="#f5c451"/>
  <rect x="7" y="8" width="1" height="1" fill="#fff8e1"/>
  <rect x="8" y="8" width="1" height="1" fill="#f5c451"/>
  <rect x="7" y="9" width="1" height="1" fill="#f5c451"/>

  <!-- Top-right mint 4-point star at (24,7) -->
  <rect x="24" y="6" width="1" height="1" fill="#4be3a0"/>
  <rect x="23" y="7" width="1" height="1" fill="#4be3a0"/>
  <rect x="24" y="7" width="1" height="1" fill="#ffffff"/>
  <rect x="25" y="7" width="1" height="1" fill="#4be3a0"/>
  <rect x="24" y="8" width="1" height="1" fill="#4be3a0"/>

  <!-- Bottom-right & bottom-left tiny twinkles -->
  <rect x="25" y="20" width="1" height="1" fill="#f5c451"/>
  <rect x="6" y="21" width="1" height="1" fill="#ff8fb1"/>

  <!-- Ribbon Bow Dark Outline (shifted down 1px: y=8..11) -->
  <rect x="11" y="8" width="4" height="1" fill="#0b0711"/>
  <rect x="17" y="8" width="4" height="1" fill="#0b0711"/>
  <rect x="10" y="9" width="1" height="2" fill="#0b0711"/>
  <rect x="21" y="9" width="1" height="2" fill="#0b0711"/>
  <rect x="15" y="9" width="2" height="1" fill="#0b0711"/>

  <!-- Ribbon Bow Fill -->
  <rect x="11" y="9" width="3" height="2" fill="#ff5c8a"/>
  <rect x="11" y="9" width="2" height="1" fill="#ff9bb8"/>
  <rect x="18" y="9" width="3" height="2" fill="#ff5c8a"/>
  <rect x="19" y="9" width="2" height="1" fill="#ff9bb8"/>
  <rect x="14" y="10" width="4" height="1" fill="#ff8fb1"/>

  <!-- Lid Outline (x: 9..22, y: 11..16) -->
  <rect x="9" y="11" width="14" height="1" fill="#0b0711"/>
  <rect x="8" y="12" width="1" height="4" fill="#0b0711"/>
  <rect x="23" y="12" width="1" height="4" fill="#0b0711"/>
  <rect x="8" y="16" width="16" height="1" fill="#0b0711"/>

  <!-- Lid Fill -->
  <rect x="9" y="12" width="14" height="1" fill="#fff1c2"/>
  <rect x="9" y="13" width="14" height="2" fill="#f5c451"/>
  <rect x="9" y="15" width="14" height="1" fill="#c98a2c"/>
  <!-- Lid Vertical Ribbon -->
  <rect x="14" y="12" width="4" height="4" fill="#ff5c8a"/>
  <rect x="15" y="12" width="2" height="1" fill="#ff9bb8"/>

  <!-- Box Body Outline (x: 9..22, y: 17..25) -->
  <rect x="9" y="17" width="1" height="8" fill="#0b0711"/>
  <rect x="22" y="17" width="1" height="8" fill="#0b0711"/>
  <rect x="10" y="25" width="12" height="1" fill="#0b0711"/>

  <!-- Box Body Fill -->
  <rect x="10" y="17" width="12" height="1" fill="#9c6419"/>
  <rect x="10" y="18" width="12" height="6" fill="#d99b32"/>
  <rect x="10" y="18" width="2" height="6" fill="#e8b24c"/>
  <rect x="20" y="18" width="2" height="6" fill="#b37820"/>
  <rect x="10" y="24" width="12" height="1" fill="#9c6419"/>

  <!-- Box Body Vertical Ribbon -->
  <rect x="14" y="17" width="4" height="8" fill="#e04372"/>
  <rect x="15" y="17" width="2" height="8" fill="#ff5c8a"/>
  <rect x="14" y="17" width="4" height="1" fill="#b02b53"/>
</svg>
